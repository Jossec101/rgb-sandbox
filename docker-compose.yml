services:
  bitcoind:
    container_name: polar-n1-backend
    environment:
      USERID: ${USERID:-1000}
      GROUPID: ${GROUPID:-1000}
    stop_grace_period: 5m
    image: polarlightning/bitcoind:${BITCOIND_VERSION:-29.0}
    command: >-
      bitcoind -server=1 -regtest=1 -rpcauth=polaruser:5e5e98c21f5c814568f8b55d83b23c1c$$066b03f92df30b11de8e4b1b1cd5b1b4281aa25205bd57df9be82caf97a05526 -zmqpubrawblock=tcp://0.0.0.0:28334 -zmqpubrawtx=tcp://0.0.0.0:28335 -zmqpubhashblock=tcp://0.0.0.0:28336 -txindex=1 -dnsseed=0 -upnp=0 -rpcbind=0.0.0.0 -rpcallowip=0.0.0.0/0 -rpcport=18443 -rest -listen=1 -listenonion=0 -fallbackfee=0.0002 -whitelist=0.0.0.0/0
    ports:
      - 18443:18443
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
  mempool-frontend-btc:
    environment:
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: "mempool-backend-btc"
      LIQUID_ENABLED: false
      LIQUID_TESTNET_ENABLED: false
    image: mempool/frontend:latest
    container_name: mempool_frontend_btc
    user: "1000:1000"
    restart: always
    command: "./wait-for mempool-db-btc:3306 --timeout=720 -- nginx -g 'daemon off;'"
    ports:
      - 7084:8080
  mempool-backend-btc:
    environment:
      MEMPOOL_BACKEND: "electrum"
      CORE_RPC_HOST: "host.docker.internal"
      CORE_RPC_PORT: "18443"
      CORE_RPC_USERNAME: "polaruser"
      CORE_RPC_PASSWORD: "polarpass"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: "mempool-db-btc"
      DATABASE_DATABASE: "mempool_btc"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"
      STATISTICS_ENABLED: "true"
      ELECTRUM_HOST: "electrs"
      ELECTRUM_PORT: "50001"
      ELECTRUM_TLS_ENABLED: "false"
    image: mempool/backend:latest
    container_name: mempool_backend_btc
    user: "1000:1000"
    restart: always
    command: "./wait-for-it.sh mempool-db-btc:3306 --timeout=720 --strict -- ./start.sh"
    depends_on:
      - mempool-db-btc
    volumes:
      - mempool_backend_btc_data:/backend/cache
  mempool-db-btc:
    environment:
      MYSQL_DATABASE: "mempool_btc"
      MYSQL_USER: "mempool"
      MYSQL_PASSWORD: "mempool"
      MYSQL_ROOT_PASSWORD: "admin"
    image: mariadb:10.5.8
    container_name: mempool_db_btc
    restart: always
    volumes:
      - mempool_db_btc_data:/var/lib/mysql
  electrs:
    image: getumbrel/electrs:v0.10.9
    container_name: electrs
    user: root
    command:
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:18443
      - --daemon-p2p-addr=bitcoind:18444
      - --cookie-file=/auth.cookie
      - --electrum-rpc-addr=0.0.0.0:50001
      - --db-dir=/data/electrs
    ports:
      - "50001:50001"
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin:ro
      - electrs_data:/data/electrs
      - ./auth.cookie:/auth.cookie:ro
    restart: always
  esplora:
    image: blockstream/esplora:latest
    command: /srv/explorer/run.sh bitcoin-regtest explorer
    environment:
      DEBUG: verbose
      NO_PRECACHE: 1
      NO_ADDRESS_SEARCH: 1
      NO_REGTEST_MINING: 1
    ports:
      - 8094:80
    volumes:
      - ./dataesplora:/data
  rgb-proxy:
    image: ghcr.io/rgb-tools/rgb-proxy-server:0.3.0
    container_name: rgb-proxy
    ports:
      - "3000:3000"
    restart: always
  rln-alice:
    build:
      context: ./rgb-lightning-node
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: rln-alice
    command: >
      /data/alice
      --daemon-listening-port=3001
      --ldk-peer-listening-port=9735
      --network=regtest
      --disable-authentication
    ports:
      - "3001:3001"
      - "9735:9735"
    volumes:
      - rln_alice_data:/data/alice
    depends_on:
      - bitcoind
      - electrs
      - rgb-proxy
    restart: always
  rln-bob:
    build:
      context: ./rgb-lightning-node
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: rln-bob
    command: >
      /data/bob
      --daemon-listening-port=3002
      --ldk-peer-listening-port=9736
      --network=regtest
      --disable-authentication
    ports:
      - "3002:3002"
      - "9736:9736"
    volumes:
      - rln_bob_data:/data/bob
    depends_on:
      - bitcoind
      - electrs
      - rgb-proxy
    restart: always
  rln-carol:
    build:
      context: ./rgb-lightning-node
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: rln-carol
    command: >
      /data/carol
      --daemon-listening-port=3003
      --ldk-peer-listening-port=9737
      --network=regtest
      --disable-authentication
    ports:
      - "3003:3003"
      - "9737:9737"
    volumes:
      - rln_carol_data:/data/carol
    depends_on:
      - bitcoind
      - electrs
      - rgb-proxy
    restart: always
volumes:
  bitcoin_data:
  mempool_backend_btc_data:
  electrs_data:
  mempool_db_btc_data:
  rln_alice_data:
  rln_bob_data:
  rln_carol_data:
